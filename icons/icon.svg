<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="#2563EB"/>
  <!-- House roof -->
  <polygon points="96,22 168,86 24,86" fill="white"/>
  <!-- House body -->
  <rect x="36" y="86" width="120" height="82" rx="3" fill="white"/>
  <!-- Door opening -->
  <rect x="70" y="108" width="52" height="60" rx="6" fill="#2563EB"/>
  <!-- % symbol in door -->
  <text x="96" y="150"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="32"
        font-weight="900"
        fill="white"
        text-anchor="middle"
        dominant-baseline="auto">%</text>
</svg>
