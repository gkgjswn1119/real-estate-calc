<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Full bleed background (no rounded corners for maskable) -->
  <rect width="192" height="192" fill="#2563EB"/>
  <!-- House roof (shifted down for safe zone padding) -->
  <polygon points="96,36 158,88 34,88" fill="white"/>
  <!-- House body -->
  <rect x="42" y="88" width="108" height="72" rx="2" fill="white"/>
  <!-- Door opening -->
  <rect x="72" y="108" width="48" height="52" rx="5" fill="#2563EB"/>
  <!-- % symbol -->
  <text x="96" y="146"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="28"
        font-weight="900"
        fill="white"
        text-anchor="middle"
        dominant-baseline="auto">%</text>
</svg>
